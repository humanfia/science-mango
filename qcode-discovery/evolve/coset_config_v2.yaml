# OpenEvolve configuration for the source-bound coset action catalog v2.
#
# This 46-action representation is checkpoint-incompatible with the legacy
# two-action catalog and every BB polynomial campaign. Launch it only with a
# fresh run id and ``run_evolution.py --evaluator coset-two-block``.

max_iterations: 300
diff_based_evolution: true
language: "json"
log_level: "INFO"
max_code_length: 30000
checkpoint_interval: 25
random_seed: 47

qcode_coset_search_portfolio:
  enabled: true
  schema_version: 3
  representation_id: "css-coset-two-block-actions-v2"
  checkpoint_compatibility_group: "coset-two-block-catalog-v2-dsl-map-v3-proof-ladder-v2"

# Proof-safe Stage-1 search contract. Eight candidates are hydrated for
# breadth, while two normality-balanced frontier lanes can consume up to 24
# sequential rung decisions. This is enough for an all-UNSAT [[360,8,*]] lane
# to reach its strict FOM=12 cutoff (4,6,...,22,23) in one evaluation; every
# individual rung remains bounded by a killable 30-second wall.
qcode_coset_stage1_proof_ladder:
  enabled: true
  schema_version: 2
  start_weight: 4
  weight_step: 2
  max_candidates_per_batch: 8
  max_new_steps_per_batch: 24
  batch_wall_timeout_s: 720.0
  step_hard_timeout_s: 30.0
  cache_directory: ".coset-stage1-proof-cache-v2"

llm:
  api_base: "http://localhost:4000/v1"
  models:
    - name: "aws/claude-opus-4-6"
      weight: 0.34
      temperature: 1.0
    - name: "azure/gpt-5.3-codex"
      weight: 0.33
      temperature: null
    - name: "gcp/gemini-3.1-pro-preview"
      weight: 0.33
      temperature: 1.0
  temperature: 1.0
  max_tokens: 16384
  timeout: 300
  retries: 4
  retry_delay: 10

prompt:
  system_message: |
    You are evolving a strict JSON policy for sparse CSS two-block codes built
    from an immutable, source-bound catalog of 46 finite-group actions. This
    is a nonabelian coset representation, not a bivariate-polynomial BB
    search. The complete program must remain one JSON object: never add
    Python, comments, imports, expressions, variable names, functions, or
    duplicate object keys.

    The schema and every object field are exact. Keep the root constants,
    catalog ID and SHA-256, representation, renderer, support_split=[3,3], all
    46 action_id values, candidate_limit=384, every catalog-derived quota, and
    every include_published value unchanged. Published supports are immutable
    regression anchors. You may add or remove explicit support objects, mutate
    their numeric indices, and mutate pair-walk offset/stride. No other field
    is mutable.

    Each explicit support is `{ "left": [i,j], "right": [u,v] }`. Values are
    nonnegative indices into that action's immutable nonidentity catalogs; the
    two indices on each side must be distinct and in range. The trusted
    renderer inserts identities, maps indices to source-bound element IDs,
    enforces the exact 3+3 split, canonicalizes, deduplicates, and round-robins
    all action lanes. No evolved value can select executable code, a callable,
    a matrix, catalog metadata, code parameters, decoder scores, witnesses,
    distance claims, or proof fields.

    An enabled walk must have an in-range offset and a positive stride coprime
    to that action's pair-of-pairs space. A disabled walk uses exactly
    offset=0,stride=1 and its explicit/published anchors must fill its quota.
    Keep the policy below 30000 bytes. Prefer small, targeted SEARCH/REPLACE
    mutations that preserve valid JSON and move underexplored action/orbit
    relationships rather than making alias-only changes.

    The objective is a novel code with rigorously certified
    FOM = k*d^2/n > 12 under the challenge degree-six constraints. Decoder or
    BP-OSD logical weights are upper bounds and receive zero positive fitness
    credit. A replayed low-weight SAT witness is reliable negative evidence.
    Only replayed UNSAT evidence supplies a distance lower bound; UNKNOWN earns
    none. Positive fitness is restricted to rebuilt CSS legality, exact rank k,
    proven lower bounds or exact distance, and structural diversity.

    When artifacts contain a short logical witness, change the implicated
    action/support relationship or walk. Preserve source-bound published
    anchors while searching structurally distinct neighborhoods and
    underoccupied nonnormal-class, normal-class, and whole-batch orbit-profile
    MAP buckets.
  include_artifacts: true
  suggest_simplification_after_chars: 12000

evaluator:
  timeout: 1200
  cascade_evaluation: true
  cascade_thresholds: [2.0, 2.0]
  parallel_evaluations: 12

database:
  population_size: 500
  archive_size: 192
  num_islands: 4
  exploration_ratio: 0.60
  exploitation_ratio: 0.30
  migration_interval: 20
  feature_dimensions:
    - "coset_nonnormal_lane_bucket"
    - "coset_normal_lane_bucket"
    - "coset_batch_orbit_profile_bucket"
  feature_bins:
    coset_nonnormal_lane_bucket: 16
    coset_normal_lane_bucket: 16
    coset_batch_orbit_profile_bucket: 8
