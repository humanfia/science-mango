# OpenEvolve configuration for the independent coset two-block representation.
#
# This geometry is intentionally checkpoint-incompatible with every historical
# BB polynomial campaign.  It must be launched with
# ``run_evolution.py --evaluator coset-two-block`` and a fresh run id.

max_iterations: 300
diff_based_evolution: true
language: "json"
log_level: "INFO"
max_code_length: 30000
checkpoint_interval: 25
random_seed: 47

# OpenEvolve ignores unknown top-level metadata; the launcher binds the
# evaluator route, source hash, and numeric checkpoint marker independently.
qcode_coset_search_portfolio:
  enabled: true
  schema_version: 2
  representation_id: "css-coset-two-block-actions-v1"
  checkpoint_compatibility_group: "coset-two-block-dsl-map-v2"

llm:
  api_base: "http://localhost:4000/v1"
  models:
    - name: "aws/claude-opus-4-6"
      weight: 0.34
      temperature: 1.0
    - name: "azure/gpt-5.3-codex"
      weight: 0.33
      temperature: null
    - name: "gcp/gemini-3.1-pro-preview"
      weight: 0.33
      temperature: 1.0
  temperature: 1.0
  max_tokens: 16384
  timeout: 300
  retries: 4
  retry_delay: 10

prompt:
  system_message: |
    You are evolving a strict JSON policy for sparse CSS two-block codes built
    from an immutable catalog of finite-group actions. This is a nonabelian
    coset representation, not a bivariate-polynomial BB search. The complete
    program must remain one JSON object: never add Python, comments, imports,
    expressions, variable names, functions, or duplicate object keys.

    The schema and every object field are exact. Keep the root constants,
    catalog SHA-256, representation, renderer, support_split=[3,3], both
    action_id enum values, candidate_limit=384, quotas 288/96, and both
    `include_published` values unchanged. The catalog lane with the published
    candidate must remain true and the lane without one must remain false.
    You may add or remove explicit support objects, mutate their numeric
    indices, and mutate the pair-walk enabled enum or numeric offset/stride.
    No other field is mutable.

    Each explicit support is `{ "left": [i,j], "right": [u,v] }`. The four
    values are nonnegative integer indices into the matching action's
    immutable non-identity catalogs; the two values on each side must be
    distinct and in range (an index may appear once on the left and once on
    the right). The trusted renderer inserts both identities, maps indices
    to source-bound element IDs, enforces the exact 3+3 split, canonicalizes,
    deduplicates, and round-robins the two action lanes. No evolved value can
    select code, a callable, a matrix, catalog metadata, code parameters,
    decoder scores, witnesses, distance claims, or proof fields.

    An enabled walk must have an in-range offset and a positive stride coprime
    to that action's pair-of-pairs space. A disabled walk uses exactly
    offset=0,stride=1 and the explicit/published anchors must then fill its
    quota exactly. Keep the policy below 30000 bytes. Prefer small, targeted
    SEARCH/REPLACE mutations that preserve valid JSON and diversify
    conjugacy/orbit patterns rather than alias jitter.

    The objective is a novel code with rigorously certified
    FOM = k*d^2/n > 12 under the challenge degree-six constraints. Decoder or
    BP-OSD logical weights are distance upper bounds and receive zero positive
    fitness credit. A replayed low-weight SAT witness is reliable negative
    evidence. Only complete two-sector UNSAT evidence supplies a distance
    lower bound. Positive fitness is restricted to rebuilt CSS legality,
    exact rank-derived k, proven lower bounds or exact distance, and structural
    diversity. UNKNOWN earns no distance credit.

    When artifacts contain a short logical witness, change the implicated
    action/orbit relationship, several numeric support indices, or the walk;
    alias jitter inside the same occupied orbit is not a repair. Preserve the
    published support as a regression anchor, but search structurally distinct
    neighborhoods and underoccupied nonnormal-lane, normal-lane, and whole-
    batch orbit-profile MAP buckets.
  include_artifacts: true
  suggest_simplification_after_chars: 12000

evaluator:
  timeout: 1200
  # The independent evaluator owns the proof-safe Stage-1 signal. Its score is
  # strictly below 1.0, so 2.0 makes the OpenEvolve Stage-2 callback unreachable;
  # the five-stage launcher consumes the persisted construction pool instead.
  cascade_evaluation: true
  cascade_thresholds: [2.0, 2.0]
  parallel_evaluations: 12

database:
  population_size: 500
  archive_size: 192
  num_islands: 4
  exploration_ratio: 0.60
  exploitation_ratio: 0.30
  migration_interval: 20
  feature_dimensions:
    - "coset_nonnormal_lane_bucket"
    - "coset_normal_lane_bucket"
    - "coset_batch_orbit_profile_bucket"
  feature_bins:
    coset_nonnormal_lane_bucket: 16
    coset_normal_lane_bucket: 16
    coset_batch_orbit_profile_bucket: 8
